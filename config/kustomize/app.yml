apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmarks-app
  labels:
    app: bookmarks-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bookmarks-app
  template:
    metadata:
      labels:
        app: bookmarks-app
    spec:
      restartPolicy: Always
      containers:
      - name: bookmarks
        image: bookmarks/app:latest
        envFrom:
        - configMapRef:
            name: bookmarks-config
        - secretRef:
            name: bookmarks-secret
        command: ['bundle', 'exec', 'rails', 's']
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /up
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              # Give the ALB time to deregister the target before SIGTERM.
              # Keep this well below terminationGracePeriodSeconds - force_shutdown_after.
              command: ["sleep", "10"]
