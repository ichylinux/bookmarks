  landing:
    header:
      subtitle: Organize information with ease
    hero:
      eyebrow: For first-time users
      title: Simplify your daily information flow
      description: Keep bookmarks, notes, tasks, and feeds in one place so your daily organization stays smooth.
    cta:
      sign_up: Get started for free
      sign_in: I already have an account
      continue_to_app: Open the app
    values:
      section_aria: Key features
      capture:
        title: Save anything, instantly
        body: Clip bookmarks, jot notes, and capture ideas the moment they strike — no friction, no forgetting.
      organize:
        title: Everything in one dashboard
        body: Bookmarks, tasks, feeds, and notes side by side — stop hunting across tabs and apps.
      focus:
        title: Your space, your way
        body: Adjust layout, theme, column count, and widths to build the dashboard that fits how you actually work.
    auth:
      sign_in_intro: Welcome back. Jump straight into the information you saved.
      sign_up_intro: Get started in minutes and keep everything important in one place.
      or_continue_with: Or continue with
      or_with_email: Or, with email
    footer:
      legal_nav_aria: Legal information
    integrations:
      heading: Sign in your way
      google:
        title: Google
        body: Sign in with Google to create an account in one step — no password to remember on this service.
      x:
        title: X (formerly Twitter)
        body: Sign in with X to import the accounts you follow and view their latest tweets in a dashboard gadget.
      facebook:
        title: Facebook
        body: Sign in with Facebook using your email address — the same quick start as Google, with no extra profile permissions.
      mastodon:
        title: Mastodon
        body: Connect your Mastodon account and display recent toots directly on your dashboard.
    changelog:
      heading: What's New
      tags:
        ux: UX Improvement
        fix: Bug Fix
        performance: Performance
        new: New Feature
      entries:
        - date: "2026-06-16"
          headline: Mark tasks as done without deleting them
          tag: new
          description: Tasks now have a distinct "done" state. Click the checkbox to mark a task complete — it stays in the list so you can see what you've accomplished, separate from items you delete.
        - date: "2026-06-16"
          headline: Add tasks from the gadget header
          tag: ux
          description: The task gadget header now has a quick-add button, matching the bookmark gadget's UX — create a new task without scrolling to the bottom of the list.
        - date: "2026-06-15"
          headline: Swipe through your notes on mobile
          tag: ux
          description: On smartphones, the note pane now joins the gadget columns in the swipe cycle — swipe through your gadgets and notes in one continuous loop.
        - date: "2026-06-12"
          headline: Sign in with Mastodon
          tag: new
          description: You can now create and sign in to your account with Mastodon, alongside Google, X, and Facebook — and show your recent toots on the dashboard.
        - date: "2026-06-09"
          headline: Highlight important tasks
          tag: new
          description: Hover a task row to reveal a highlight toggle. Highlighted tasks stand out with a colored border, background, and bold text.
        - date: "2026-05-24"
          headline: Manage connected sign-in providers
          tag: new
          description: The preferences page now lists Google, X, Facebook, and email sign-in with link status and disconnect controls.
        - date: "2026-05-24"
          headline: Sign in with Facebook
          tag: new
          description: You can now create and sign in to your account with Facebook, alongside Google and X.
        - date: "2026-05-22"
          headline: Add X accounts by username
          tag: new
          description: You can now manually add any public X (Twitter) account to your following list by entering their username directly, without needing to sign in with X OAuth.
        - date: "2026-05-20"
          headline: Delete your account from preferences
          tag: new
          description: You can now delete your own account from the preferences page. Your account is deactivated immediately and all data is fully erased within 90 days per our privacy policy.
        - date: "2026-05-20"
          headline: Reorder dashboard gadgets on mobile
          tag: new
          description: Long-press any gadget header on a smartphone to drag and rearrange gadgets across columns without needing a mouse.
        - date: "2026-05-19"
          headline: Add bookmarks directly from your dashboard
          tag: new
          description: A new button in the bookmark gadget header lets you save a bookmark without leaving the dashboard. The dialog auto-fetches the page title when you paste a URL.
        - date: "2026-05-19"
          headline: Fixed visited-link tracking on the dashboard
          tag: fix
          description: We fixed an issue where clicking links in dashboard gadgets could fail to record them as visited.
        - date: "2026-05-18"
          headline: See which links you've already opened
          tag: new
          description: Clicked links in the bookmark, feed, and X gadgets are now shown in grey so you can tell at a glance what you've already read.
        - date: "2026-05-18"
          headline: Adjust portal column width ratios
          tag: new
          description: You can now set individual column widths from preferences. Drag the sliders to fine-tune how your dashboard space is distributed across columns.
        - date: "2026-05-16"
          headline: Set the number of tweets displayed in the X gadget
          tag: new
          description: You can now configure how many tweets appear in the X dashboard gadget from the X account settings page.
        - date: "2026-05-16"
          headline: Icons added to dashboard gadget headers
          tag: ux
          description: Calendar, task, and bookmark gadgets now display a matching icon in their header for quicker at-a-glance recognition.
        - date: "2026-05-14"
          headline: Toggle column navigation buttons visibility in preferences
          tag: ux
          description: You can now show or hide the mobile column navigation buttons from your preferences page.
        - date: "2026-05-14"
          headline: Show X (Twitter) followed accounts on your dashboard
          tag: new
          description: Sign in with X to import your following list and display selected accounts' tweets in a dashboard gadget.
        - date: "2026-05-12"
          headline: Mastodon account integration
          tag: new
          description: You can now register a Mastodon account and show recent toots in the dashboard gadget.
        - date: "2026-05-12"
          headline: Fixed bookmark title fetching
          tag: fix
          description: We fixed an issue where "Fetch from URL" could not retrieve page titles during bookmark creation.
        - date: "2026-05-01"
          headline: Redesigned the landing page
          tag: ux
          description: We refreshed the visitor-facing page to present the app's features more clearly.
        - date: "2026-04-15"
          headline: Faster feed loading
          tag: performance
          description: Optimized feed update processing to reduce load times when there are many entries.
        - date: "2026-03-28"
          headline: Two-factor authentication is now available
          tag: new
          description: You can now enable TOTP-based two-factor authentication from your preferences page.

