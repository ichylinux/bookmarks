  pages:
    privacy:
      title: プライバシーポリシー
      back_home: "← ホームに戻る"
      sections:
        data_collected:
          heading: 収集する情報
          body: "本サービスは、利用者のブックマーク、フィード設定、ポータル設定、および利用設定を保存します。これらのデータはサービスの提供に必要な範囲でのみ使用します。X（旧Twitter）でサインインする場合は、OAuthトークンおよびユーザーIDを取得します。\n\nIPアドレス、ブラウザの種類、アクセス日時などのアクセスログは、サーバーの運用管理目的でのみ記録され、第三者に提供することはありません。"
        x_login:
          heading: X（旧Twitter）ログインの目的
          body: "本サービスは、X（旧Twitter）のOAuth 2.0を利用した認証機能を提供しています。Xアカウントでのサインインは、パスワードを本サービスに登録することなくアカウントを作成・利用するためのものです。\n\n取得する権限は読み取り専用（アカウント情報とメールアドレスの確認）に限定されており、ツイートの投稿、フォロー操作、ダイレクトメッセージの送受信などの操作は行いません。"
        email_handling:
          heading: メールアドレスの取り扱い
          body: "Xアカウントでのサインイン時、Xから提供されるメールアドレスをアカウント識別に使用します。メールアドレスはサービス内部の識別用途にのみ使用し、マーケティング目的での利用や第三者への提供は行いません。\n\nXがメールアドレスを提供しない場合は、アカウント識別用の代替値を自動生成します。実際のメールアドレスが後から取得できた場合は、アカウント情報を更新します。"
        data_retention:
          heading: データ保持
          body: "利用者のデータは、アカウントが有効である限り保持されます。\n\n設定画面からアカウントを削除した場合、アカウントは直ちに無効化され、ログインおよびサービスの利用はできなくなります。アカウント情報（メールアドレス、表示名、OAuth連携識別子等）および紐づくデータ（ブックマーク、フィード設定等）は、削除申請から起算して90日以内に限りサーバー上に保持されます。保持期間中、利用者自身によるアクセスや復元の操作はできず、当該データはサービスの提供には使用しません。誤削除と運営者が判断した場合に限り、保持期間中にアカウントの復旧を行うことがあります。90日経過後、これらのデータは完全に削除されます。\n\n本サービスは個人利用を目的としたサービスです。利用者自身がデータの管理権限を持ち、設定画面からいつでもアカウントを削除することができます。"
        contact:
          heading: お問い合わせ
          body: "プライバシーに関するお問い合わせは、X（旧Twitter）の @ichylinux アカウントへのダイレクトメッセージにてお受けします。"
    terms:
      title: 利用規約
      back_home: "← ホームに戻る"
      sections:
        acceptable_use:
          heading: 利用上のルール
          body: "本サービスは個人利用を目的として提供されています。商業目的での再配布、転売、または他者へのアクセス提供を目的とした利用は禁止します。\n\n自動化されたスクレイピング、過度なリクエスト送信、またはサービスの正常な運用を妨げる行為は禁止します。法令に違反する用途での利用も禁止します。"
        availability:
          heading: サービスの提供
          body: "本サービスは現状有姿（as-is）で提供されます。サービスの継続的な提供を目指しますが、メンテナンス、障害、またはその他の理由によりサービスが一時的に利用できない場合があります。\n\nサービスの停止、データの損失、または利用不能によって生じた損害について、運営者は責任を負いません。重要なデータは定期的にバックアップすることを推奨します。"
        termination:
          heading: アカウントの終了
          body: "利用者はいつでも設定画面からアカウントを削除することができます。削除の申請によりアカウントは直ちに無効化され、ログインおよびサービスの利用はできなくなります。アカウント情報（メールアドレス、表示名、OAuth連携識別子等）および紐づくデータは、申請から起算して90日以内に限りサーバー上に保持され、保持期間の経過後に完全に削除されます。保持期間中、利用者自身による復元はできません。誤削除と運営者が判断した場合に限り、保持期間中にアカウントの復旧を行うことがあります。\n\n利用規約に違反する行為が確認された場合、運営者は事前通知なくアカウントを停止または削除する場合があります。"
