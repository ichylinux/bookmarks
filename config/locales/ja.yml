        title: X（旧Twitter）
        body: Xアカウントでサインインしてフォロー中のアカウントを取り込み、ダッシュボードで最新ツイートを確認できます。
      facebook:
        title: Facebook
        body: Facebookのメールアドレスでサインインできます。Googleと同様に、余分なプロフィール権限は要求しません。
      mastodon:
        title: Mastodon
        body: Mastodonアカウントを登録して、ダッシュボードに最新トゥートを表示できます。
    changelog:
      heading: 新着情報
      tags:
        ux: UX改善
        fix: 不具合修正
        performance: パフォーマンス
        new: 新機能
      entries:
        - date: "2026-05-25"
          headline: ランディングページを刷新しました
          tag: ux
          description: 訪問者向けページのヒーロー表示を整理し、サインイン方法と最新のお知らせを分かりやすく掲載しました。
        - date: "2026-05-24"
          headline: 連携アカウントを設定画面で管理できるようになりました
          tag: new
          description: 設定画面に Google・X・Facebook・メールの各サインイン方法の連携状態と解除操作を表示するようになりました。
        - date: "2026-05-24"
          headline: Facebookでサインインできるようになりました
          tag: new
          description: GoogleやXに加え、Facebookアカウントでも新規登録・サインインできるようになりました。
        - date: "2026-05-22"
          headline: ユーザー名でXアカウントを追加できるようになりました
          tag: new
          description: XのOAuth認証なしに、ユーザー名を直接入力してXアカウントをフォローリストに追加できるようになりました。
        - date: "2026-05-20"
          headline: 設定画面からアカウントを削除できるようになりました
          tag: new
          description: 設定ページからご自身のアカウントを削除できるようになりました。削除するとアカウントは直ちに無効化され、プライバシーポリシーに基づき90日以内にデータが完全に消去されます。
        - date: "2026-05-20"
          headline: スマートフォンでガジェットを並べ替えられるようになりました
          tag: new
          description: スマートフォンでガジェットのヘッダーを長押しすると、列をまたいでガジェットをドラッグして並べ替えられるようになりました。
        - date: "2026-05-19"
          headline: ダッシュボードからブックマークを追加できるようになりました
          tag: new
          description: ブックマークガジェットのヘッダーにある追加ボタンから、ダッシュボードを離れずにブックマークを保存できるようになりました。URLを貼り付けるとページタイトルを自動で取得します。
        - date: "2026-05-19"
          headline: リンクの既読表示が正しく記録されない不具合を修正しました
          tag: fix
          description: クリック済みリンクの記録処理でエラーが発生する場合があった不具合を修正しました。
        - date: "2026-05-18"
          headline: 一度開いたリンクがわかるようになりました
          tag: new
          description: ダッシュボードのブックマーク・フィード・Xガジェットで、クリック済みのリンクをグレーアウトで表示するようになりました。どのリンクをすでに読んだか一目で確認できます。
        - date: "2026-05-18"
          headline: ポータル列幅の比率を自由に調整できるようになりました
          tag: new
          description: 設定画面のスライダーで列ごとの幅比率を細かく指定できるようになりました。ダッシュボードのスペースを自分好みに配分できます。
        - date: "2026-05-16"
          headline: X ガジェットの表示ツイート数を設定できるようになりました
          tag: new
          description: X アカウントの設定ページから、ダッシュボードガジェットに表示するツイート数を変更できるようになりました。
        - date: "2026-05-16"
          headline: ダッシュボードガジェットのヘッダーにアイコンを追加しました
          tag: ux
          description: カレンダー・タスク・ブックマークのガジェットヘッダーにアイコンが表示されるようになり、一目で識別しやすくなりました。
        - date: "2026-05-14"
          headline: 列切り替えボタンの表示・非表示を設定できるようになりました
          tag: ux
          description: 設定ページから、モバイル向けの列切り替えボタンを表示するかどうか切り替えられるようになりました。
        - date: "2026-05-14"
          headline: X（旧Twitter）フォロー中アカウントをダッシュボードに表示できるようになりました
          tag: new
          description: XアカウントでサインインするとフォローリストをBookmarksに取り込み、ダッシュボードのガジェットで選択したアカウントのツイートを確認できるようになりました。
        - date: "2026-05-12"
          headline: Mastodonアカウント連携に対応しました
          tag: new
          description: Mastodonアカウントを登録して、ダッシュボードのガジェットに最新トゥートを表示できるようになりました。
        - date: "2026-05-12"
          headline: ブックマーク作成時のタイトル取得を修正しました
          tag: fix
          description: 「URLから取得」でページタイトルを取得できないことがある不具合を修正しました。
        - date: "2026-05-01"
          headline: ランディングページを刷新しました
          tag: ux
          description: 訪問者向けのページデザインを一新し、サービスの特徴をより分かりやすく伝えられるようにしました。
        - date: "2026-04-15"
          headline: フィード読み込み速度を改善しました
          tag: performance
          description: フィードの更新処理を最適化し、大量のエントリがある場合の読み込み時間を短縮しました。
        - date: "2026-03-28"
          headline: 2段階認証に対応しました
          tag: new
          description: TOTPアプリを使った2段階認証を設定できるようになりました。アカウントの安全性を高めるためにご活用ください。

